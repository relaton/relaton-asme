inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'spec/fixtures/**/*'
    - 'tmp/**/*'
    - 'demo*.rb'
    - 'debug*.rb'
    - 'test*.rb'
    - 'scrape*.rb'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'Rakefile'
    - '*.gemspec'

Metrics/AbcSize:
  Exclude:
    - 'lib/relaton_asme/fetcher/publication_page.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/relaton_asme/fetcher/publication_page.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/relaton_asme/fetcher/publication_page.rb'

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 80
  AllowedPatterns:
    - '\A\s*#'

Metrics/MethodLength:
  Max: 50

Metrics/ClassLength:
  Max: 700

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: true